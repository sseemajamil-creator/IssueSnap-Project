{% extends 'base/base.html' %}

{% block content %}
<div class="section-dark py-5" style="padding-top:120px!important">
  <div class="container text-center py-4">
    <span class="section-label" style="color:#93C5FD">Contact</span>
    <h1 class="section-title" style="color:white">Get in Touch</h1>
  </div>
</div>

<section class="py-5">
  <div class="container py-4">
    <div class="row g-4 justify-content-center">
      <div class="col-lg-7">
        <div class="card-issuesnap p-4 p-md-5">
          <h4 class="fw-700 mb-4">Send Us a Message</h4>
          <form method="post">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Your Name *</label>
                <input type="text" name="name" class="form-control" required placeholder="Full name">
              </div>
              <div class="col-md-6">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-control" required placeholder="your@email.com">
              </div>
              <div class="col-12">
                <label class="form-label">Subject *</label>
                <input type="text" name="subject" class="form-control" required placeholder="What is this about?">
              </div>
              <div class="col-12">
                <label class="form-label">Message *</label>
                <textarea name="message" class="form-control" rows="6" required placeholder="Describe your query..."></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn-primary-custom">
                  <i class="bi bi-send-fill me-2"></i>Send Message
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card-issuesnap p-4 mb-4">
          <h6 class="fw-700 mb-3"><i class="bi bi-info-circle me-2 text-primary"></i>Contact Information</h6>
          <div class="d-flex gap-3 mb-3">
            <i class="bi bi-envelope text-primary mt-1"></i>
            <div>
              <div class="fw-600 small">Email</div>
              <div class="text-muted small">support@issuesnap.com</div>
            </div>
          </div>
          <div class="d-flex gap-3">
            <i class="bi bi-clock text-primary mt-1"></i>
            <div>
              <div class="fw-600 small">Response Time</div>
              <div class="text-muted small">Within 24 business hours</div>
            </div>
          </div>
        </div>
        <div class="card-issuesnap p-4">
          <h6 class="fw-700 mb-3"><i class="bi bi-question-circle me-2 text-primary"></i>Quick Help</h6>
          <a href="{% url 'pages:faq' %}" class="btn btn-outline-primary w-100 mb-2" style="border-radius:10px">View FAQ</a>
          {% if user.is_authenticated %}
          <a href="{% url 'complaints:track_complaint' %}" class="btn btn-outline-secondary w-100" style="border-radius:10px">Track Complaint</a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
